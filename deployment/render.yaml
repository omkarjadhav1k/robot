services:
  - type: web
    name: business-ai-robot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: robot-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: DEFAULT_ROBOT_ID
        value: ROBOT-001

databases:
  - name: robot-postgres
    plan: free
    region: oregon
    databaseName: business_ai_robot
    user: robot_user
