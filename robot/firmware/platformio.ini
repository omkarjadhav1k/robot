[platformio]
src_dir = robot_firmware

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    ; Note: When physical OLED arrives, uncomment the following libraries:
    ; adafruit/Adafruit SSD1306 @ ^2.5.9
    ; adafruit/Adafruit GFX Library @ ^1.11.9
